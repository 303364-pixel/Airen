<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Trailblazer | New Guinsaugon National High School</title>
<meta name="description" content="The Trailblazer — New Guinsaugon National High School official school publication.">
<link rel="icon" href="logo.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--green:#003d2b;--deep:#002a1d;--gold:#ffd329;--text:#173127;--muted:#697b70;--line:#e5eae5;--bg:#f4f7f2}
*{box-sizing:border-box}body{margin:0;font-family:Poppins,Arial,sans-serif;color:var(--text);background:var(--bg)}
button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{max-width:1400px;margin:auto;background:#fff;min-height:100vh;box-shadow:0 6px 40px #10371b18}
header{background:linear-gradient(100deg,#00321f 0%,#005239 65%,#00321f 100%);color:white;position:relative;overflow:hidden}
header:after{content:"";position:absolute;width:480px;height:480px;border-radius:50%;background:#e4d83d12;right:-160px;top:-280px}
.brand{display:flex;align-items:center;gap:24px;padding:25px 40px;position:relative;z-index:1}
.brand img{width:135px;height:135px;object-fit:contain;filter:drop-shadow(0 4px 8px #0006);background:white;border-radius:50%}
.brand-text{flex:1}.overline{font-size:21px;font-weight:900;line-height:1}.brand h1{font-size:clamp(38px,5vw,75px);line-height:.98;margin:4px 0;font-weight:900;letter-spacing:-.045em}.brand h1 span{color:var(--gold)}
.school{font-weight:700;font-size:clamp(12px,1.5vw,21px);letter-spacing:.045em}.official{font-size:12px;letter-spacing:.32em;margin-top:5px}
.tagline{text-align:right;max-width:255px;font-weight:700;font-style:italic;font-size:18px;color:#ffed9d}
nav{display:flex;align-items:center;gap:3px;padding:0 28px;background:white;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
nav button{border:0;background:transparent;color:#102c20;padding:18px 15px;font-size:12px;font-weight:800;white-space:nowrap;border-bottom:4px solid transparent}
nav button:hover,nav button.active{border-bottom-color:var(--gold);color:#005238}
.tools{display:flex;align-items:center;gap:8px;margin-left:auto}.tools input{width:175px;min-width:130px;border:1px solid #cdd9ce;border-radius:30px;padding:8px 12px;font-size:12px}
main{padding:26px 30px 45px}.section-heading{display:flex;justify-content:space-between;align-items:center;margin:0 0 18px;gap:10px}.section-heading h2{font-size:26px;margin:0}.section-heading small{color:var(--muted)}
.top-grid{display:grid;grid-template-columns:2.15fr 1fr;gap:14px}.side-stack{display:grid;grid-template-rows:1fr 1fr;gap:14px}
.story{position:relative;border:0;border-radius:8px;overflow:hidden;text-align:left;background:#f4f6f2;display:block;width:100%;cursor:pointer;color:inherit;min-height:175px}
.story:hover{box-shadow:0 12px 28px #002d1d2c;transform:translateY(-2px)}.story{transition:transform .2s,box-shadow .2s}
.story img{width:100%;height:100%;object-fit:cover;display:block}.overlay{position:absolute;inset:0;background:linear-gradient(0deg,#001f16ed 0%,#001f1670 45%,transparent 82%)}
.story-body{position:absolute;bottom:0;left:0;right:0;padding:20px;color:white}.hero{min-height:390px}.hero .story-body{padding:25px}.hero h3{font-size:clamp(24px,2.5vw,39px);line-height:1.18;max-width:650px}.story h3{font-size:19px;line-height:1.25;margin:9px 0}.hero p{font-size:14px;max-width:600px}.meta{font-size:11px;opacity:.85}
.chip{display:inline-block;border-radius:6px;background:#007e50;color:white;padding:6px 12px;font-size:11px;font-weight:800;text-transform:uppercase}.chip.opinion{background:#ffcc00;color:#1c321f}.chip.cartoon{background:#087d87}.chip.feature{background:#007b46}.chip.science{background:#0c77c9}.chip.sports{background:#dc3328}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:18px}.card{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:white;cursor:pointer;display:flex;flex-direction:column;transition:transform .2s}.card:hover{transform:translateY(-4px);box-shadow:0 8px 25px #003d2b20}
.card-image{height:190px;position:relative}.card-image img{width:100%;height:100%;object-fit:cover}.card-image .chip{position:absolute;top:10px;left:10px}
.card-content{padding:15px 17px;flex:1;display:flex;flex-direction:column}.card h3{margin:0 0 7px;font-size:19px;line-height:1.3}.card p{color:#6b776f;font-size:13px;line-height:1.6;margin:0 0 14px}.card .meta{color:#65766a;margin-top:auto}
.empty{padding:60px 15px;text-align:center;color:var(--muted);background:#f7f9f6;border-radius:12px}
footer{background:var(--deep);color:#e3eee6;padding:28px;text-align:center;font-size:13px}footer strong{color:var(--gold)}
.modal-backdrop{position:fixed;inset:0;background:#001d13b8;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal-backdrop.open{display:flex}
.modal{width:min(740px,100%);max-height:90vh;overflow-y:auto;background:white;border-radius:16px;padding:28px;position:relative}.modal h2{margin:0 0 14px}.modal .close{position:absolute;top:12px;right:15px;background:#edf2ed;border:0;border-radius:50%;width:36px;height:36px}
.modal img{width:100%;max-height:350px;object-fit:cover;border-radius:10px}.modal p{white-space:pre-line;line-height:1.8}
.cms{background:#f9fbf8;border:1px solid var(--line);border-radius:14px;padding:25px}.cms input,.cms textarea,.cms select{display:block;width:100%;padding:11px;border:1px solid #bfcfc1;border-radius:8px;margin:6px 0 16px;background:white}.cms label{font-size:13px;font-weight:700}.cms textarea{min-height:150px}.primary{border:0;background:var(--green);color:white;border-radius:8px;padding:11px 18px;font-weight:700}.secondary{border:1px solid #b4c7b8;background:white;border-radius:8px;padding:10px 16px;font-weight:700}.danger{background:#aa2c2c}.cms-row{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px}.cms-list{display:grid;gap:9px;margin-top:25px}.cms-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;background:white;border:1px solid var(--line);border-radius:8px}.cms-item small{display:block;color:var(--muted)}
.note{font-size:12px;color:#7a6252;background:#fff6e8;padding:12px;border-radius:8px;line-height:1.6}
@media(max-width:950px){.brand{padding:20px}.brand img{width:95px;height:95px}.tagline{display:none}.top-grid{grid-template-columns:1fr}.side-stack{grid-template-columns:1fr 1fr;grid-template-rows:auto}.side-stack .story{height:240px}.cards{grid-template-columns:repeat(2,1fr)}nav{padding:0 10px}}
@media(max-width:600px){.brand{gap:10px;padding:14px}.brand img{width:70px;height:70px}.brand h1{font-size:clamp(26px,7.8vw,42px)}.overline{font-size:13px}.school{font-size:9px}.official{font-size:8px;letter-spacing:.12em}nav button{padding:13px 11px;font-size:11px}main{padding:14px}.hero{min-height:390px}.hero h3{font-size:25px}.side-stack{grid-template-columns:1fr}.side-stack .story{height:210px}.cards{grid-template-columns:1fr}.card-image{height:220px}.section-heading h2{font-size:21px}.modal{padding:20px}.tools input{width:130px}}
</style></head><body><div class="shell">
<header><div class="brand"><img src="logo.png" alt="New Guinsaugon National High School publication emblem"><div class="brand-text"><div class="overline">THE</div><h1><span>TRAIL</span>BLAZER<span>✒</span></h1><div class="school">NEW GUINSAUGON NATIONAL HIGH SCHOOL</div><div class="official">OFFICIAL SCHOOL PUBLICATION</div></div><div class="tagline">Truth. Voices. Stories.<br>A Brighter Tomorrow.</div></div></header>
<nav id="nav"></nav><main id="main"></main>
<footer><strong>THE TRAILBLAZER</strong> · New Guinsaugon National High School<br>Official School Publication · Sample website prototype</footer></div>
<div class="modal-backdrop" id="modal" role="dialog" aria-modal="true"><div class="modal" id="modalInner"></div></div>
<script>
const CATS=[['news','News'],['opinion','Opinion'],['cartoon','Editorial Cartooning'],['feature','Feature'],['science','Science and Technology'],['sports','Sports News']];
const KEY='trailblazer-posts-v2',PIN='3333';
const DEMO=[];
let posts=read(),page='home',unlocked=false,editing=null,query='';
function read(){try{let p=JSON.parse(localStorage.getItem(KEY));return Array.isArray(p)?p:[]}catch{return []}}
function save(){localStorage.setItem(KEY,JSON.stringify(posts))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function cat(t){return CATS.find(x=>x[0]===t)?.[1]||'News'}
function img(p){return p.image||({news:'hero.jpg',opinion:'opinion.jpg',cartoon:'cartoon.jpg',feature:'feature.jpg',science:'science.jpg',sports:'sports.jpg'}[p.type])}
function nav(){document.getElementById('nav').innerHTML=[['home','⌂ Home'],...CATS,['admin','CMS']].map(([id,label])=>`<button class="${page===id?'active':''}" onclick="go('${id}')">${esc(label)}</button>`).join('')+`<div class="tools"><input aria-label="Search articles" placeholder="Search articles..." value="${esc(query)}" oninput="search(this.value)"></div>`}
function search(v){query=v;render()}
function go(p){page=p;query='';window.scrollTo(0,0);render()}
function filtered(type){return posts.filter(p=>(!type||p.type===type)&&(!query||[p.title,p.summary,p.body].join(' ').toLowerCase().includes(query.toLowerCase())))}
function badge(p){return `<span class="chip ${esc(p.type)}">${esc(cat(p.type))}</span>`}
function heroCard(p,kind='hero'){return `<button class="story ${kind}" onclick="openPost('${esc(p.id)}')"><img src="${esc(img(p))}" alt=""><div class="overlay"></div><div class="story-body">${badge(p)}<h3>${esc(p.title)}</h3>${kind==='hero'?`<p>${esc(p.summary)}</p>`:''}<div class="meta">${p.demo?'Sample article · ':''}${esc(p.date||'Preview only')}</div></div></button>`}
function card(p){return `<article class="card" tabindex="0" role="button" onclick="openPost('${esc(p.id)}')" onkeydown="if(event.key==='Enter')openPost('${esc(p.id)}')"><div class="card-image"><img src="${esc(img(p))}" alt="" loading="lazy">${badge(p)}</div><div class="card-content"><h3>${esc(p.title)}</h3><p>${esc(p.summary)}</p><div class="meta">${p.demo?'SAMPLE · ':''}${esc(p.date||'Preview only')}　 Read More →</div></div></article>`}
function home(){let items=filtered();if(!items.length)return `<div class="empty">No stories found. Try a different search.</div>`;let [first,...rest]=items;return `<div class="section-heading"><h2>Latest Stories</h2><small>Student journalism · School publication</small></div><div class="top-grid">${heroCard(first)}<div class="side-stack">${rest.slice(0,2).map(p=>heroCard(p,'side')).join('')}</div></div><div class="cards">${rest.slice(2).map(card).join('')}</div>`}
function categoryPage(){let items=filtered(page);return `<div class="section-heading"><h2>${esc(cat(page))}</h2><small>${items.length} ${items.length===1?'story':'stories'}</small></div>${items.length?`<div class="cards">${items.map(card).join('')}</div>`:`<div class="empty">No articles in this section yet.</div>`}`}
function openPost(id){let p=posts.find(p=>p.id===id);if(!p)return;document.getElementById('modalInner').innerHTML=`<button class="close" aria-label="Close" onclick="closeModal()">×</button>${badge(p)}<h2>${esc(p.title)}</h2><div class="meta">${p.demo?'Sample / illustrative content · ':''}${esc(p.date||'')}</div><img src="${esc(img(p))}" alt=""><p>${esc(p.body)}</p>`;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function cms(){if(!unlocked)return `<div class="cms" style="max-width:480px;margin:auto"><h2>Publication CMS</h2><p>Enter the administrator PIN to edit articles.</p><form onsubmit="unlock(event)"><label>PIN<input id="pin" type="password" inputmode="numeric" required></label><button class="primary">Unlock CMS</button><p id="error" style="color:#b22"></p></form><p class="note">Prototype only. The PIN is stored in front-end code, and articles are saved in this browser only. Use server-side authentication and a database before publishing a public multi-editor website.</p></div>`;
let p=posts.find(x=>x.id===editing)||{};return `<div class="cms"><div class="section-heading"><h2>Publication Content Manager</h2><button class="secondary" onclick="unlocked=false;go('home')">Lock</button></div><p class="note">Demo CMS: edits are stored locally in your browser. Visitors on other devices will not see your edits. Do not store private student information here.</p><form id="postForm" onsubmit="submitPost(event)"><label>Headline<input id="title" required maxlength="160" value="${esc(p.title||'')}" placeholder="Article headline"></label><label>Section<select id="type">${CATS.map(([id,n])=>`<option value="${id}" ${p.type===id?'selected':''}>${n}</option>`).join('')}</select></label><label>Short summary<input id="summary" required value="${esc(p.summary||'')}" placeholder="Brief summary"></label><label>Article text<textarea id="body" required>${esc(p.body||'')}</textarea></label><label>Image filename (use bundled images or a hosted image URL)<input id="image" value="${esc(p.image||'')}" placeholder="hero.jpg"></label><label>Publication date<input id="date" type="date" value="${esc(p.date||'')}"></label><div class="cms-row"><button class="primary">${editing?'Update article':'Add article'}</button><button type="button" class="secondary" onclick="editing=null;render()">Clear form</button><button type="button" class="secondary" onclick="exportPosts()">Export JSON</button><label class="secondary" style="cursor:pointer">Import JSON<input type="file" accept="application/json" style="display:none" onchange="importPosts(event)"></label></div></form><div class="cms-list">${posts.map(x=>`<div class="cms-item"><div><strong>${esc(x.title)}</strong><small>${esc(cat(x.type))}</small></div><div class="cms-row"><button class="secondary" onclick="editing='${esc(x.id)}';render();window.scrollTo(0,0)">Edit</button><button class="secondary danger" style="color:white" onclick="removePost('${esc(x.id)}')">Delete</button></div></div>`).join('')}</div></div>`}
function unlock(e){e.preventDefault();if(document.getElementById('pin').value===PIN){unlocked=true;render()}else document.getElementById('error').textContent='Incorrect PIN'}
function submitPost(e){e.preventDefault();let o={id:editing||'p'+Date.now(),title:document.getElementById('title').value.trim(),type:document.getElementById('type').value,summary:document.getElementById('summary').value.trim(),body:document.getElementById('body').value.trim(),image:document.getElementById('image').value.trim(),date:document.getElementById('date').value,demo:false};if(editing)posts=posts.map(x=>x.id===editing?o:x);else posts.unshift(o);editing=null;save();render()}
function removePost(id){if(confirm('Delete this article?')){posts=posts.filter(x=>x.id!==id);save();render()}}
function exportPosts(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(posts,null,2)],{type:'application/json'}));a.download='trailblazer-articles.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importPosts(e){let f=e.target.files?.[0];if(!f)return;f.text().then(t=>{try{let data=JSON.parse(t);if(!Array.isArray(data)||!data.every(x=>x.title&&CATS.some(c=>c[0]===x.type)))throw Error();if(!confirm('Replace all existing local articles with imported articles?'))return;posts=data.map(x=>({...x,id:String(x.id||'p'+Math.random())}));save();render()}catch{alert('Invalid publication JSON file.')}})}
function render(){nav();document.getElementById('main').innerHTML=page==='admin'?cms():page==='home'?home():categoryPage()}
render();
</script></body></html>
